<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body {
      width: 240px;
      margin: 0;
      padding: 14px;
      font: 13px/1.45 system-ui, sans-serif;
      background: #1e1e22;
      color: #eee;
    }
    h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
    button {
      width: 100%;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    #start { background: #2e7d32; color: #fff; }
    #stop  { background: #dc3434; color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    .statusrow { font-size: 12px; min-height: 16px; }
    #status { opacity: .85; }
    #elapsed { font-variant-numeric: tabular-nums; opacity: .7; }
    .hint { font-size: 11px; opacity: .55; margin-top: 8px; }
    code { background: #000; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Audit Capture</h1>
  <button id="start">Start session</button>
  <button id="stop" disabled>Stop &amp; export</button>
  <div class="statusrow"><span id="status">Idle.</span> <span id="elapsed"></span></div>
  <div class="hint">
    MARK: <code>Alt+Shift+M</code> &middot; Toggle: <code>Alt+Shift+A</code>
  </div>
  <script src="popup.js"></script>
</body>
</html>
